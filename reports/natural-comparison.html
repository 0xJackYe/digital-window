<h1>丹佛 · 同一张实拍的连续日光</h1>
<p>以下为软件实际运行截图：背景始终是同一张高清丹佛照片，前景为写字楼窗框。光照方向、冷暖和局部明暗根据所选时刻连续计算；这四张图只展示变化过程中的四个时刻，渲染器没有四个时段节点，也没有用三维城市替换照片。</p>
<section>
<figure><img src="photo-denver-morning.png" alt="丹佛照片上的清晨日光模拟"><figcaption>07:30 · 晨间光色</figcaption></figure>
<figure><img src="photo-denver-noon.png" alt="丹佛照片上的正午日光模拟"><figcaption>12:00 · 日间光色</figcaption></figure>
<figure><img src="photo-denver-evening.png" alt="丹佛照片上的傍晚日光模拟"><figcaption>16:50 · 暮光过渡</figcaption></figure>
<figure><img src="photo-denver-night.png" alt="丹佛照片上的夜间月光模拟"><figcaption>22:00 · 夜间环境光与月光</figcaption></figure>
</section>
<footer>时间为测试日期的丹佛当地时间。原片中的既有投影属于拍摄时刻。连续参数与实际渲染验证见<a href="software-tests.json">完整软件测试报告</a>。照片作者与许可见<a href="../ASSET_CREDITS.md">素材来源</a>。</footer>
